name: CI & SonarCloud Monorepo

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  # ============================================================
  # 1. DETECT CHANGED FOLDERS
  # ============================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
              - 'sonar-project.properties'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
              - 'sonar-project.properties'

  # ============================================================
  # 2. BACKEND TESTS & COVERAGE
  # ============================================================
  backend-test:
    name: Backend - Test & Coverage
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: backend

      - name: Run Backend Tests & JaCoCo Coverage
        run: ./gradlew test jacocoTestReport
        working-directory: backend

      - name: Upload Backend Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/build/reports/jacoco/test/jacocoTestReport.xml

  # ============================================================
  # 3. FRONTEND TESTS & COVERAGE (pnpm)
  # ============================================================
  frontend-test:
    name: Frontend - Test & Coverage (pnpm)
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Type Check (TypeScript)
        run: pnpm exec tsc --noEmit
        working-directory: frontend

      - name: Run Frontend Coverage Script
        run: pnpm test:coverage
        working-directory: frontend

      - name: Upload Frontend Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info

  # ============================================================
  # 4. SONARCLOUD SCAN (Aggregated)
  # ============================================================
  sonarcloud:
    name: SonarCloud Analysis
    needs: [changes, backend-test, frontend-test]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Backend Coverage Artifact
        if: ${{ needs.changes.outputs.backend == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/build/reports/jacoco/test/

      - name: Download Frontend Coverage Artifact
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

      - name: Run SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}