spring:
  # ============================================================
  # APPLICATION CONFIGURATION
  # ============================================================
  application:
    name: LetsTable Backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mvc:
    problemdetails:
      enabled: true

  # ============================================================
  # DATABASE CONFIGURATION
  # ============================================================
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    baseline-on-migrate: true

  # ============================================================
  # MAIL CONFIGURATION
  # ============================================================
mail:
  from-address: ${MAIL_FROM_ADDRESS:noreply@letstable.com}
  from-name: "Let's Table"
  enabled: ${MAIL_ENABLED:true}

brevo:
  api-key: ${BREVO_API_KEY:}

# ============================================================
# SWAGGER CONFIGURATION
# ============================================================
springdoc:
  api-docs.path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    url: /v3/api-docs

# ============================================================
# SERVER CONFIGURATION
# ============================================================
server:
  port: ${PORT:8080}
  address: 0.0.0.0

# ============================================================
# JWT CONFIGURATION
# ============================================================
jwt:
  secret: ${JWT_SECRET:59e01dfd95914a2922b3e94636b2d4c4f1633f19f2d55a7cde95ec60cf476e0b}
  access-token-ttl-minutes: 15
  refresh-token-ttl-days: 7

# ============================================================
# OTP CONFIGURATION
# ============================================================
otp:
  ttl-minutes: 30
  max-attempts: 3
  resend-cooldown-seconds: 60

# ============================================================
# BGG CONFIGURATION
# ============================================================
bgg:
  api-token: ${BGG_API_TOKEN:}

# ============================================================
# SEEDING CONFIGURATION
# ============================================================
seeding:
  enabled: ${SEEDING_ENABLED:false}

# ============================================================
# S3 CONFIGURATION
# ============================================================
s3:
  url: ${S3_URL:http://localhost:9000}
  access-key: ${S3_ACCESS_KEY:minioadmin}
  secret-key: ${S3_SECRET_KEY:minioadmin}
  bucket: ${S3_BUCKET:uploads}
  region: ${S3_REGION:eu-central-1}