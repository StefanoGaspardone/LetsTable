<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Password reset</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 24px;">
<table role="presentation" width="100%" style="max-width: 480px; margin: 0 auto; background-color: #ffffff; border-radius: 8px; padding: 32px;">
    <tr>
        <td>
            <h2 style="color: #1a1a1a; margin-top: 0;">Reset your password</h2>
            <p style="color: #444444; font-size: 15px; line-height: 1.5;">
                Use the code below to reset your Let's Table password.
            </p>
            <div style="text-align: center; margin: 32px 0;">
                    <span style="display: inline-block; font-size: 32px; letter-spacing: 8px; font-weight: bold; color: #1a1a1a; background-color: #f0f0f0; padding: 16px 24px; border-radius: 6px;"
                          th:text="${otpCode}">123456</span>
            </div>
            <p style="color: #777777; font-size: 13px;">
                This code expires in <span th:text="${expiresInMinutes}">10</span> minutes. If you didn't request this, you can safely ignore this email.
            </p>
        </td>
    </tr>
</table>
</body>
</html>
