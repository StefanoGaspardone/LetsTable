spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/testdb
    username: test
    password: test

  main:
    banner-mode: "off"

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: "Y2hpYXZlX3NlZ3JldGFfc3RhdGljYV9kaV9hbG1lbm8yNTZiaXRfcGVyX2lfdGVzdF91bml0YXJpXzEyMzQ1Njc4OQ=="
  access-token-ttl-minutes: 15
  refresh-token-ttl-days: 7

otp:
  ttl-minutes: 10
  max-attempts: 5
  resend-cooldown-seconds: 60

logging:
  level:
    root: ERROR
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql: OFF
    com.backend: ERROR

bgg:
  base-url: http://localhost:8080/mock-bgg

minio:
  url: http://localhost:9000
  access-key: test-key
  secret-key: test-secret
  bucket: test-bucket

scheduling:
  enabled: false

seeding:
  enabled: false